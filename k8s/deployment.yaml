apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-classifier
  labels:
    app: wine-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wine-classifier
  template:
    metadata:
      labels:
        app: wine-classifier
    spec:
      containers:
        - name: api
          image: ghcr.io/slider79/mlops-lab:sha-4296a50
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
