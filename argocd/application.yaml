apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wine-classifier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/slider79/mlops-gitops-config.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
